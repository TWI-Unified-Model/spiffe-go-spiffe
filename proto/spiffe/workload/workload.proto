syntax = "proto3";

import "google/protobuf/struct.proto";

service SpiffeWorkloadAPI {
    /////////////////////////////////////////////////////////////////////////
    // X509-SVID Profile
    /////////////////////////////////////////////////////////////////////////

    // Fetch X.509-SVIDs for all SPIFFE identities the workload is entitled to,
    // as well as related information like trust bundles and CRLs. As this
    // information changes, subsequent messages will be streamed from the
    // server.
    rpc FetchX509SVID(X509SVIDRequest) returns (stream X509SVIDResponse);

    // Fetch trust bundles and CRLs. Useful for clients that only need to
    // validate SVIDs without obtaining an SVID for themself. As this
    // information changes, subsequent messages will be streamed from the
    // server.
    rpc FetchX509Bundles(X509BundlesRequest) returns (stream X509BundlesResponse);

    /////////////////////////////////////////////////////////////////////////
    // JWT-SVID Profile
    /////////////////////////////////////////////////////////////////////////

    // Fetch JWT-SVIDs for all SPIFFE identities the workload is entitled to,
    // for the requested audience. If an optional SPIFFE ID is requested, only
    // the JWT-SVID for that SPIFFE ID is returned.
    rpc FetchJWTSVID(JWTSVIDRequest) returns (JWTSVIDResponse);

    // Fetches the JWT bundles, formatted as JWKS documents, keyed by the
    // SPIFFE ID of the trust domain. As this information changes, subsequent
    // messages will be streamed from the server.
    rpc FetchJWTBundles(JWTBundlesRequest) returns (stream JWTBundlesResponse);

    // Validates a JWT-SVID against the requested audience. Returns the SPIFFE
    // ID of the JWT-SVID and JWT claims.
    rpc ValidateJWTSVID(ValidateJWTSVIDRequest) returns (ValidateJWTSVIDResponse);

    /////////////////////////////////////////////////////////////////////////
    // WIT-SVID Profile
    /////////////////////////////////////////////////////////////////////////

    // Fetch WIT-SVIDs for all SPIFFE identities the workload is entitled to.
    // As this information changes, subsequent messages will be streamed from
    // the server.
    rpc FetchWITSVID(WITSVIDRequest) returns (stream WITSVIDResponse);

    // Fetch WIT bundles, formatted as JWKS documents, keyed by the SPIFFE ID
    // of the trust domain. As this information changes, subsequent messages
    // will be streamed from the server.
    rpc FetchWITBundles(WITBundlesRequest) returns (stream WITBundlesResponse);
    /////////////////////////////////////////////////////////////////////////
    // Attested Credential Acquisition
    /////////////////////////////////////////////////////////////////////////
    //
    // The three calls of the Credential Acquisition API of
    // draft-novak-rats-tacra (TACRA), by which a Workload running in a
    // hardware-based trusted execution environment obtains a credential
    // bound to Evidence of its own, for a key the Workload generates and
    // never hands out. The Workload API endpoint is the Credential
    // Acquisition System Client of TACRA: a conduit between the Workload,
    // which is the Attester, and the Credential Acquisition System Server.
    // The endpoint attests the calling Workload as it does for FetchX509SVID,
    // and the credential it conveys is one the Workload is entitled to.
    //
    // Must return Unimplemented where the Workload API endpoint does not
    // support attested credential acquisition.

    // Initiates attested credential acquisition for a Target: returns the
    // Freshness Kind and, for present-nonce and present-epoch, the Freshness
    // Handle the Workload embeds in its Evidence, with the Credential
    // Acquisition Mode and the algorithms the Credential Authority or the
    // Secret Vault accepts (TACRA, Initiate-Credential-Acquisition).
    rpc InitiateCredentialAcquisition(InitiateCredentialAcquisitionRequest) returns (InitiateCredentialAcquisitionResponse);

    // Enrolls a new proof-of-possession credential: an X509-SVID for a
    // Credential Signing Key the Workload generated, from a PKCS#10 CSR and
    // Evidence bound to that CSR (TACRA, Enroll-Credential). The private key
    // stays with the Workload.
    rpc EnrollCredential(EnrollCredentialRequest) returns (EnrollCredentialResponse);

    // Retrieves a pre-existing credential, sealed to a Credential Encryption
    // Key the Workload generated, from Evidence bound to that key (TACRA,
    // Retrieve-Credential). Only the Workload can open the returned bundle.
    rpc RetrieveCredential(RetrieveCredentialRequest) returns (RetrieveCredentialResponse);
}

// The X509SVIDRequest message conveys parameters for requesting an X.509-SVID.
// There are currently no request parameters.
message X509SVIDRequest {  }

// The X509SVIDResponse message carries X.509-SVIDs and related information,
// including a set of global CRLs and a list of bundles the workload may use
// for federating with foreign trust domains.
message X509SVIDResponse {
    // Required. A list of X509SVID messages, each of which includes a single
    // X.509-SVID, its private key, and the bundle for the trust domain.
    repeated X509SVID svids = 1;

    // Optional. ASN.1 DER encoded certificate revocation lists.
    repeated bytes crl = 2;

    // Optional. CA certificate bundles belonging to foreign trust domains that
    // the workload should trust, keyed by the SPIFFE ID of the foreign trust
    // domain. Bundles are ASN.1 DER encoded.
    map<string, bytes> federated_bundles = 3;
}

// The X509SVID message carries a single SVID and all associated information,
// including the X.509 bundle for the trust domain.
message X509SVID {
    // Required. The SPIFFE ID of the SVID in this entry
    string spiffe_id = 1;

    // Required. ASN.1 DER encoded certificate chain. MAY include
    // intermediates, the leaf certificate (or SVID itself) MUST come first.
    bytes x509_svid = 2;

    // Required. ASN.1 DER encoded PKCS#8 private key. MUST be unencrypted.
    bytes x509_svid_key = 3;

    // Required. ASN.1 DER encoded X.509 bundle for the trust domain.
    bytes bundle = 4;

    // Optional. An operator-specified string used to provide guidance on how this
    // identity should be used by a workload when more than one SVID is returned.
    // For example, `internal` and `external` to indicate an SVID for internal or
    // external use, respectively.
    string hint = 5;
}

// The X509BundlesRequest message conveys parameters for requesting X.509
// bundles. There are currently no such parameters.
message X509BundlesRequest {
}

// The X509BundlesResponse message carries a set of global CRLs and a map of
// trust bundles the workload should trust.
message X509BundlesResponse {
    // Optional. ASN.1 DER encoded certificate revocation lists.
    repeated bytes crl = 1;

    // Required. CA certificate bundles belonging to trust domains that the
    // workload should trust, keyed by the SPIFFE ID of the trust domain.
    // Bundles are ASN.1 DER encoded.
    map<string, bytes> bundles = 2;
}

message JWTSVIDRequest {
    // Required. The audience(s) the workload intends to authenticate against.
    repeated string audience = 1;

    // Optional. The requested SPIFFE ID for the JWT-SVID. If unset, all
    // JWT-SVIDs to which the workload is entitled are requested.
    string spiffe_id = 2;
}

// The JWTSVIDResponse message conveys JWT-SVIDs.
message JWTSVIDResponse {
    // Required. The list of returned JWT-SVIDs.
    repeated JWTSVID svids = 1;
}

// The JWTSVID message carries the JWT-SVID token and associated metadata.
message JWTSVID {
    // Required. The SPIFFE ID of the JWT-SVID.
    string spiffe_id = 1;

    // Required. Encoded JWT using JWS Compact Serialization.
    string svid = 2;

    // Optional. An operator-specified string used to provide guidance on how this
    // identity should be used by a workload when more than one SVID is returned.
    // For example, `internal` and `external` to indicate an SVID for internal or
    // external use, respectively.
    string hint = 3;
}

// The JWTBundlesRequest message conveys parameters for requesting JWT bundles.
// There are currently no such parameters.
message JWTBundlesRequest { }

// The JWTBundlesReponse conveys JWT bundles.
message JWTBundlesResponse {
    // Required. JWK encoded JWT bundles, keyed by the SPIFFE ID of the trust
    // domain.
    map<string, bytes> bundles = 1;
}

// The ValidateJWTSVIDRequest message conveys request parameters for
// JWT-SVID validation.
message ValidateJWTSVIDRequest {
    // Required. The audience of the validating party. The JWT-SVID must
    // contain an audience claim which contains this value in order to
    // succesfully validate.
    string audience = 1;

    // Required. The JWT-SVID to validate, encoded using JWS Compact
    // Serialization.
    string svid = 2;
}

// The ValidateJWTSVIDReponse message conveys the JWT-SVID validation results.
message ValidateJWTSVIDResponse {
    // Required. The SPIFFE ID of the validated JWT-SVID.
    string spiffe_id = 1;

    // Optional. Arbitrary claims contained within the payload of the validated
    // JWT-SVID.
    google.protobuf.Struct claims = 2;
}

// WITSVIDRequest conveys parameters for requesting WIT-SVIDs.
message WITSVIDRequest {
    // Optional. The requested SPIFFE ID for the WIT-SVID. If unset, all
    // WIT-SVIDs to which the workload is entitled are requested.
    string spiffe_id = 1;
}

// WITSVIDResponse conveys WIT-SVIDs.
message WITSVIDResponse {
    // Required. The list of returned WIT-SVIDs.
    repeated WITSVID svids = 1;
}

// WITSVID carries a single WIT-SVID and associated metadata.
message WITSVID {
    // Required. The SPIFFE ID of the WIT-SVID.
    string spiffe_id = 1;

    // Required. Encoded WIT-SVID using JWS Compact Serialization.
    string wit_svid = 2;

    // Required. JWK-encoded private key bound to this WIT-SVID.
    string wit_svid_key = 3;

    // Optional. An operator-specified string used to provide guidance on how
    // this identity should be used by a workload when more than one SVID is
    // returned.
    string hint = 4;
}

// WITBundlesRequest conveys parameters for requesting WIT bundles.
// There are currently no such parameters.
message WITBundlesRequest { }

// WITBundlesResponse conveys WIT bundles.
message WITBundlesResponse {
    // Required. JWK encoded WIT bundles, keyed by the SPIFFE ID of the trust
    // domain.
    map<string, string> bundles = 1;
}

// FreshnessKind classifies the freshness of Evidence in one credential
// acquisition exchange (TACRA, Freshness Kind). The present kinds carry a
// Freshness Handle the Workload embeds in its Evidence; the absent kinds
// carry none.
enum FreshnessKind {
    FRESHNESS_KIND_UNSPECIFIED = 0;

    // No freshness claim.
    FRESHNESS_KIND_ABSENT_NONE = 1;

    // The Workload stamps its Evidence with its own timestamp.
    FRESHNESS_KIND_ABSENT_TIMESTAMP = 2;

    // The Workload embeds an epoch marker it already holds.
    FRESHNESS_KIND_ABSENT_EPOCH = 3;

    // The Freshness Handle is a single-use nonce.
    FRESHNESS_KIND_PRESENT_NONCE = 4;

    // The Freshness Handle is the current epoch marker. The Workload calls
    // InitiateCredentialAcquisition again when the epoch has moved.
    FRESHNESS_KIND_PRESENT_EPOCH = 5;
}

// CredentialAcquisitionMode is the mode in which the credential of a Target is
// acquired (TACRA, Credential Acquisition Mode).
enum CredentialAcquisitionMode {
    CREDENTIAL_ACQUISITION_MODE_UNSPECIFIED = 0;

    // Enrollment: a new proof-of-possession credential is minted for a key
    // the Workload generated (EnrollCredential).
    CREDENTIAL_ACQUISITION_MODE_ENROLL = 1;

    // Retrieval: a pre-existing credential is released, sealed to a key the
    // Workload generated (RetrieveCredential).
    CREDENTIAL_ACQUISITION_MODE_RETRIEVE = 2;
}

// CredentialType names the kind of credential acquired (TACRA, Credential
// Type token).
enum CredentialType {
    CREDENTIAL_TYPE_UNSPECIFIED = 0;

    // An X.509 certificate (x509). Enrollment mints an X509-SVID.
    CREDENTIAL_TYPE_X509 = 1;

    // A WIMSE Workload Identity Certificate (wic): an X.509
    // certificate whose one URI SAN is the Workload identifier.
    CREDENTIAL_TYPE_WIC = 2;

    // A WIMSE Workload Identity Token (wit). Retrieval only.
    CREDENTIAL_TYPE_WIT = 3;

    // A JSON Web Token used as a bearer token (jwt). Retrieval only.
    CREDENTIAL_TYPE_JWT = 4;

    // An API key (api-key). Retrieval only.
    CREDENTIAL_TYPE_API_KEY = 5;

    // A pre-shared symmetric key (psk). Retrieval only.
    CREDENTIAL_TYPE_PSK = 6;

    // A private key shared by the instances of a replicated service (
    // private-key). Retrieval only.
    CREDENTIAL_TYPE_PRIVATE_KEY = 7;
}

// The EvidenceBinding message declares how the Attester-held key is bound to
// the Evidence (TACRA, Binding Credential Keys to Evidence).
message EvidenceBinding {
    // Required. The binding method. binding-input is the digest of the
    // freshness element, the Target and the subject (the CSR, or the public
    // Credential Encryption Key), each preceded by its length, written into
    // the freshness input of the Evidence.
    string method = 1;

    // Required. The digest the method uses, for example sha512.
    string hash = 2;
}

// The InitiateCredentialAcquisitionRequest message conveys the parameters
// of Initiate-Credential-Acquisition.
message InitiateCredentialAcquisitionRequest {
    // Required. The Target: the octet string that names the Relying Party
    // the credential is for, as the Workload and that party agree on it.
    // With SPIRE, the SPIFFE ID of the trust domain names the trust domain
    // whose Workloads rely on the credential.
    string target = 1;

    // Optional. The Credential Type the Workload plans to use with the
    // Target. If unset, the policy for the Target decides.
    CredentialType credential_type = 2;

    // Optional. The Credential Hint. With SPIRE, the hint of the
    // registration entry whose identity the Workload wants when it is
    // entitled to more than one.
    string credential_hint = 3;
}

// The InitiateCredentialAcquisitionResponse message conveys what the
// Workload needs to produce its key and its Evidence.
message InitiateCredentialAcquisitionResponse {
    // Required. The mode in which the credential of the Target is acquired.
    CredentialAcquisitionMode mode = 1;

    // Required. The Freshness Kind of this exchange.
    FreshnessKind freshness_kind = 2;

    // The Freshness Handle: required for present-nonce (16 to 64 octets, at
    // least 128 bits of entropy, issued once) and present-epoch (8 to 64
    // octets), absent otherwise. The Workload embeds it in its Evidence and
    // sends it back as the freshness element of the second call.
    bytes freshness_handle = 3;

    // Optional. Seconds until the Freshness Handle is no longer valid.
    uint32 expires_in = 4;

    // Optional. For absent-timestamp, the maximum age in seconds of
    // Evidence the Verifier accepts.
    uint32 max_age = 5;

    // The signature algorithms the Credential Authority accepts for the
    // Credential Signing Key, by name, for example ecdsa-p256-sha256.
    // Required when mode is enroll, absent
    // otherwise.
    repeated string acceptable_csk = 6;

    // The HPKE suites the Secret Vault seals to, each named by its KEM, KDF
    // and AEAD joined with +, for example
    // DHKEM(P-256, HKDF-SHA256)+HKDF-SHA256+AES-256-GCM. Required when mode
    // is retrieve, absent otherwise.
    repeated string acceptable_cek = 7;

    // Optional. The Evidence formats accepted, each named by its media
    // type, for example application/vnd.veraison.tsm-report+cbor. When set,
    // the second call names the format of its Evidence in evidence_profile.
    repeated string acceptable_evidence = 8;
}

// The EnrollCredentialRequest message conveys the parameters of
// Enroll-Credential. target, credential_type and credential_hint repeat
// those of the InitiateCredentialAcquisition call that began the exchange.
message EnrollCredentialRequest {
    // Required. The Target of the InitiateCredentialAcquisition call.
    string target = 1;

    // Optional. The Credential Type: x509 or wic. A present-nonce exchange
    // that named one at initiation names the same here.
    CredentialType credential_type = 2;

    // Optional. The Credential Hint, as at initiation.
    string credential_hint = 3;

    // Required. The Freshness Kind the InitiateCredentialAcquisition call
    // returned.
    FreshnessKind freshness_kind = 4;

    // The freshness element the Evidence binds: the Freshness Handle for
    // present-nonce and present-epoch, the epoch marker the Workload holds
    // for absent-epoch, the 8-octet timestamp of the Workload for
    // absent-timestamp, absent for absent-none.
    bytes freshness_element = 5;

    // Required. ASN.1 DER encoded PKCS#10 CSR, signed by the Credential
    // Signing Key the Workload generated. The CSR conveys the public key;
    // the SPIFFE ID of the credential comes from the registration of the
    // Workload, as for FetchX509SVID, not from the CSR.
    bytes csr = 6;

    // Required. The Evidence, bound to the CSR, the Target and the freshness
    // element as binding declares.
    bytes evidence = 7;

    // Optional. The media type of the Evidence, one of the acceptable_evidence
    // of the InitiateCredentialAcquisition response.
    string evidence_profile = 8;

    // Required. How the Evidence binds the CSR.
    EvidenceBinding binding = 9;
}

// The EnrollCredentialResponse message carries the enrolled X509-SVID. It
// carries no private key: the key never left the Workload.
message EnrollCredentialResponse {
    // Required. The SPIFFE ID of the X509-SVID.
    string spiffe_id = 1;

    // Required. ASN.1 DER encoded certificate chain. MAY include
    // intermediates, the leaf certificate (or SVID itself) MUST come first.
    bytes x509_svid = 2;

    // Required. ASN.1 DER encoded X.509 bundle for the trust domain.
    bytes bundle = 3;

    // Optional. An operator-specified string used to provide guidance on how
    // this identity should be used by a Workload, as in X509SVID.
    string hint = 4;
}

// The RetrieveCredentialRequest message conveys the parameters of
// Retrieve-Credential. target, credential_type and credential_hint repeat
// those of the InitiateCredentialAcquisition call that began the exchange.
message RetrieveCredentialRequest {
    // Required. The Target of the InitiateCredentialAcquisition call.
    string target = 1;

    // Optional. The Credential Type. A present-nonce exchange that named
    // one at initiation names the same here.
    CredentialType credential_type = 2;

    // Optional. The Credential Hint, as at initiation.
    string credential_hint = 3;

    // Required. The Freshness Kind the InitiateCredentialAcquisition call
    // returned.
    FreshnessKind freshness_kind = 4;

    // The freshness element the Evidence binds, as for EnrollCredential.
    bytes freshness_element = 5;

    // Required. The public Credential Encryption Key the Secret Vault seals
    // the credential to, in the encoding of its KEM: a DER
    // SubjectPublicKeyInfo for DHKEM(P-256, HKDF-SHA256), the encapsulation
    // key itself for a hybrid KEM.
    bytes cek_pub = 6;

    // Required. The Evidence, bound to cek_pub, the Target and the freshness
    // element as binding declares.
    bytes evidence = 7;

    // Optional. The media type of the Evidence, one of the acceptable_evidence
    // of the InitiateCredentialAcquisition response.
    string evidence_profile = 8;

    // Required. How the Evidence binds cek_pub.
    EvidenceBinding binding = 9;
}

// The RetrieveCredentialResponse message carries the released credential,
// sealed to the Credential Encryption Key of the Workload.
message RetrieveCredentialResponse {
    // Required. The encrypted credential bundle of TACRA (Sealing the
    // Released Credential): a JSON container that names its HPKE suite and
    // carries the encapsulated key, the ciphertext and the associated data,
    // which names the credential group, the Target, the freshness element
    // and the Credential Hint. Only the holder of the Credential Encryption
    // Key can open it. The Workload API endpoint treats it as opaque.
    bytes encrypted_credential_bundle = 1;
}

option go_package = "github.com/spiffe/go-spiffe/v2/proto/spiffe/workload;workload";
